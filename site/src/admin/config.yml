backend:
  name: git-gateway
  branch: main

# For local development, uncomment below:
# local_backend: true

media_folder: "site/src/assets/images"
public_folder: "/assets/images"

collections:
  # Main Pages
  - name: "pages"
    label: "Pages"
    folder: "site/src/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "select", default: "layouts/page.njk", options: ["layouts/page.njk", "layouts/about.njk", "layouts/delegations.njk"] }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Hero Title", name: "heroTitle", widget: "string", required: false, hint: "Override the page title shown on hero" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
      - { label: "Section Image", name: "sectionImage", widget: "image", required: false, hint: "About page: image shown beside the mission text" }
      - { label: "Mission Text", name: "missionText", widget: "text", required: false, hint: "About page: mission paragraph" }
      - { label: "About Text", name: "aboutText", widget: "markdown", required: false, hint: "About page: 'About MASCP' section" }
      - { label: "Network Text", name: "networkText", widget: "markdown", required: false, hint: "About page: 'About Our Network' section" }
      - { label: "Side Image 1", name: "sideImage1", widget: "image", required: false, hint: "Via Crucis: top sidebar image" }
      - { label: "Side Image 2", name: "sideImage2", widget: "image", required: false, hint: "Via Crucis: bottom sidebar image" }
      - { label: "Donate Heading", name: "donateHeading", widget: "text", required: false, hint: "Donate page: main heading text" }
      - { label: "Donate Subheading", name: "donateSubheading", widget: "string", required: false, hint: "Donate page: subheading (e.g. ¡MUCHÍSIMAS GRACIAS!)" }
      - { label: "PayPal Button ID", name: "paypalButtonId", widget: "string", required: false, hint: "Donate page: PayPal hosted button ID" }
      - { label: "Gallery Image 1", name: "galleryImage1", widget: "image", required: false, hint: "Historical Memory page: gallery image 1 of 6" }
      - { label: "Gallery Image 2", name: "galleryImage2", widget: "image", required: false, hint: "Historical Memory page: gallery image 2 of 6" }
      - { label: "Gallery Image 3", name: "galleryImage3", widget: "image", required: false, hint: "Historical Memory page: gallery image 3 of 6" }
      - { label: "Gallery Image 4", name: "galleryImage4", widget: "image", required: false, hint: "Historical Memory page: gallery image 4 of 6" }
      - { label: "Gallery Image 5", name: "galleryImage5", widget: "image", required: false, hint: "Historical Memory page: gallery image 5 of 6" }
      - { label: "Gallery Image 6", name: "galleryImage6", widget: "image", required: false, hint: "Historical Memory page: gallery image 6 of 6" }
      - { label: "Intro Text", name: "introText", widget: "text", required: false, hint: "Fair Trade page: intro paragraph below the title" }
      - { label: "Main Text", name: "mainText", widget: "markdown", required: false, hint: "Fair Trade page: main content column" }
      - { label: "Civil War Text", name: "civilWarText", widget: "text", required: false, hint: "History page: civil war section paragraph" }
      - { label: "Accompaniment Text", name: "accompanimentText", widget: "markdown", required: false, hint: "History page: accompaniment section paragraphs" }
      - { label: "Video Title", name: "videoTitle", widget: "string", required: false, hint: "History page: sidebar video title" }
      - { label: "Video Caption", name: "videoCaption", widget: "text", required: false, hint: "History page: sidebar video caption" }
      - { label: "Video URL", name: "videoUrl", widget: "string", required: false, hint: "History page: YouTube embed URL" }
      - { label: "Quote Text", name: "quoteText", widget: "text", required: false, hint: "History page: full-width quote" }
      - { label: "Quote Image", name: "quoteImage", widget: "image", required: false, hint: "History page: background image behind the quote" }
      - { label: "Organizing Text", name: "organizingText", widget: "markdown", required: false, hint: "History page: organizing section paragraphs" }
      - { label: "Celebrations Image", name: "celebrationsImage", widget: "image", required: false, hint: "History page: celebrations image in Learn More section" }
      - { label: "Org Name", name: "orgName", widget: "string", required: false, hint: "Contact page: organization name" }
      - { label: "Address Line 1", name: "address1", widget: "string", required: false, hint: "Contact page: first address line" }
      - { label: "Address Line 2", name: "address2", widget: "string", required: false, hint: "Contact page: city, state, zip" }
      - { label: "Email", name: "email", widget: "string", required: false, hint: "Contact page: email address" }
      - label: "Newsletters"
        name: "newsletters"
        widget: "list"
        required: false
        hint: "Newsletter Archive page: add newest entries at the top"
        fields:
          - { label: "Date", name: "date", widget: "string", hint: "e.g. February 2026" }
          - { label: "Link", name: "href", widget: "string", hint: "Full URL to the newsletter" }
          - { label: "Thumbnail URL", name: "img", widget: "string", hint: "URL of the thumbnail image" }

  # Home Page (special)
  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home Page"
        file: "site/src/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/home.njk" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Hero Image Caption", name: "heroCaption", widget: "string", required: false, hint: "Optional caption shown below the hero image" }
          - { label: "Welcome Heading", name: "welcomeHeading", widget: "string", required: false, hint: "Large heading shown above the welcome text" }
          - { label: "Welcome Text", name: "welcome", widget: "text" }
          - { label: "Additional Content", name: "body", widget: "markdown", required: false }

  # Events
  - name: "events"
    label: "Events"
    folder: "site/src/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Site Settings
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "navigation"
        label: "Navigation"
        file: "site/src/_data/navigation.json"
        fields:
          - name: "main"
            label: "Main Navigation"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - name: "children"
                label: "Dropdown Items"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
      - name: "social"
        label: "Social Links"
        file: "site/src/_data/social.json"
        fields:
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
      - name: "site"
        label: "Site Settings"
        file: "site/src/_data/site.json"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Site URL", name: "url", widget: "string" }
          - { label: "Site Description", name: "description", widget: "text" }
          - { label: "MailerLite Account ID", name: "mailerlite_account_id", widget: "string", hint: "Found in MailerLite under Integrations > API" }
          - { label: "MailerLite Form ID", name: "mailerlite_form_id", widget: "string", hint: "Found when you create an embedded form" }
